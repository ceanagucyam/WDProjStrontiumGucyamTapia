<!DOCTYPE html>
<html lang="en">
<head>

  <style>

    /* Specific styles for the results list */

    }
    .delete-btn {
      background: #ff4d4d;
      color: white;
      border: 2px solid black;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 5px;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
  </style>

<body>

    <div class="header-row">

    </div>

    <main class="content-box">
      <div id="resultsList">
        </div>

      <div class="btn-row">
