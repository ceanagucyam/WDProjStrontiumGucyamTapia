<div class="main-container">

    <div class="header-row">
        <img class="logo" src="public/assets/favicon.png" alt="Website Logo">
        <div class="site-title">TokkiNet.kr</div>

<nav class="nav-buttons">

<main class="content-box">
  <form id="quizForm">

    <p>Nickname:</p>
    <input type="text" id="nickname" required>

    <p>Bias</p>
    <select id="bias" required>
      <option value="">Select Bias</option>
      <option value="Minji">Minji</option>
      <option value="Hanni">Hanni</option>
      <option value="Danielle">Danielle</option>
      <option value="Haerin">Haerin</option>
      <option value="Hyein">Hyein</option>
    </select>

    <p>Preferred Content:</p>
    <label><input type="checkbox" value="song"> Songs</label>
    <label><input type="checkbox" value="performance"> Performances</label>
    <label><input type="checkbox" value="youtube"> YouTube Videos</label>

    <p>Mood:</p>
<div class="mood-options">
  <label><input type="radio" name="mood" value="Nostalgic"> Nostalgic</label>
  <label><input type="radio" name="mood" value="Energetic"> Energetic</label>
  <label><input type="radio" name="mood" value="Chill"> Chill</label>
</div>

<button type="submit" class="link-btn">Get Recommendations</button>


  </form>
</main>
